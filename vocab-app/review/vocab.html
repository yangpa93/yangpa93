x.","색인에서 그것을 찾아봐라."],["The price index rose.","물가 지수가 올랐다."],["The index is at the back.","색인은 뒤쪽에 있다."]]}]},{"l":"고2-4","w":"indispensable","p":"adj.","a":[],"s":[{"m":"없어서는 안 될, 필수적인","y":["essential","vital"],"e":[["She is indispensable to the team.","그녀는 그 팀에 없어서는 안 될 존재이다."],["Water is indispensable for life.","물은 생명에 필수적이다."],["This tool has become indispensable.","이 도구는 필수품이 되었다."]]}]},{"l":"고2-4","w":"induce","p":"v.","a":[],"s":[{"m":"유발하다, 유도하다","y":["cause","bring on"],"e":[["The drug induces sleep.","그 약은 잠을 유도한다."],["Nothing could induce him to change.","어떤 것도 그를 바꾸도록 설득하지 못했다."],["Stress can induce headaches.","스트레스는 두통을 유발할 수 있다."]]}]},{"l":"고2-4","w":"infant","p":"n.","a":[],"s":[{"m":"유아, 아기","y":["baby"],"e":[["The infant sleeps a lot.","그 유아는 잠을 많이 잔다."],["An infant needs constant care.","유아는 끊임없는 돌봄이 필요하다."],["She held the infant gently.","그녀는 아기를 부드럽게 안았다."]]}]},{"l":"고2-4","w":"infect","p":"v.","a":[],"s":[{"m":"감염시키다","y":[],"e":[["The wound became infected.","그 상처가 감염되었다."],["A virus infected many people.","바이러스가 많은 사람을 감염시켰다."],["Do not infect others.","남을 감염시키지 마라."]]}]},{"l":"고2-4","w":"infer","p":"v.","a":[],"s":[{"m":"추론하다","y":["deduce"],"e":[["We can infer the answer.","우리는 답을 추론할 수 있다."],["She inferred his mood.","그녀는 그의 기분을 짐작했다."],["Readers infer meaning from context.","독자는 문맥에서 뜻을 추론한다."]]}]},{"l":"고2-4","w":"inference","p":"n.","a":[],"s":[{"m":"추론","y":["conclusion","deduction"],"e":[["That is a reasonable inference.","그것은 합리적인 추론이다."],["Draw an inference from the passage.","그 지문에서 추론을 이끌어 내라."],["His inference proved wrong.","그의 추론은 틀린 것으로 드러났다."]]}]},{"l":"고2-4","w":"inflate","p":"v.","a":[],"s":[{"m":"부풀리다","y":["blow up"],"e":[["Inflate the tire first.","먼저 타이어에 바람을 넣어라."],["He inflated the balloon.","그는 풍선을 불었다."],["The raft inflates in seconds.","그 구명보트는 몇 초 만에 부풀어 오른다."]]}]},{"l":"고2-4","w":"ingenious","p":"adj.","a":[],"s":[{"m":"기발한, 독창적인","y":["clever","inventive"],"e":[["It was an ingenious solution.","그것은 기발한 해결책이었다."],["She has an ingenious mind.","그녀는 독창적인 사고를 지녔다."],["The device is simple yet ingenious.","그 장치는 단순하지만 기발하다."]]}]},{"l":"고2-4","w":"ingredient","p":"n.","a":[],"s":[{"m":"재료, 성분","y":["component"],"e":[["Read the ingredient list.","성분표를 읽어라."],["Flour is the main ingredient.","밀가루가 주재료다."],["One ingredient was missing.","재료 하나가 빠져 있었다."]]}]},{"l":"고2-4","w":"inhabit","p":"v.","a":[],"s":[{"m":"살다, 서식하다","y":["live in"],"e":[["Birds inhabit this forest.","새들이 이 숲에 산다."],["Few people inhabit the island.","그 섬에는 사람이 거의 살지 않는다."],["Fish inhabit the deep sea.","물고기가 심해에 서식한다."]]}]},{"l":"고2-4","w":"inherent","p":"adj.","a":[],"s":[{"m":"내재하는, 본질적인","y":["built-in","natural"],"e":[["There are inherent risks in the sport.","그 스포츠에는 내재된 위험이 있다."],["Curiosity is inherent in children.","호기심은 아이들에게 본래 있는 것이다."],["The problem is inherent in the design.","그 문제는 설계 자체에 내재해 있다."]]}]},{"l":"고2-4","w":"inhibit","p":"v.","a":[],"s":[{"m":"억제하다, 막다","y":["hold back"],"e":[["Fear inhibits creativity.","두려움은 창의성을 억제한다."],["The drug inhibits the growth of bacteria.","그 약은 세균의 증식을 억제한다."],["Shyness inhibited him from speaking.","수줍음이 그가 말하는 것을 막았다."]]}]},{"l":"고2-4","w":"initial","p":"adj.","a":[],"s":[{"m":"처음의, 최초의","y":["first"],"e":[["My initial answer was wrong.","내 처음 답은 틀렸다."],["The initial plan changed.","최초의 계획이 바뀌었다."],["Initial results look good.","초기 결과는 좋아 보인다."]]}]},{"l":"고2-4","w":"initiate","p":"v.","a":[],"s":[{"m":"시작하다, 착수하다","y":["begin","launch"],"e":[["They initiated a new program.","그들은 새 프로그램을 시작했다."],["She initiated the conversation.","그녀가 대화를 먼저 시작했다."],["The government initiated reforms.","정부가 개혁에 착수했다."]]}]},{"l":"고2-4","w":"inject","p":"v.","a":[],"s":[{"m":"주사하다, 주입하다","y":[],"e":[["The nurse injected the medicine.","간호사가 약을 주사했다."],["They injected new money into the project.","그들은 그 사업에 새 자금을 투입했다."],["He injected humor into the talk.","그는 강연에 유머를 넣었다."]]}]},{"l":"고2-4","w":"inn","p":"n.","a":[],"s":[{"m":"여관","y":[],"e":[["We stayed at a country inn.","우리는 시골 여관에 묵었다."],["The inn is old but clean.","그 여관은 낡았지만 깨끗하다."],["An inn stood by the road.","여관이 길가에 있었다."]]}]},{"l":"고2-4","w":"innovate","p":"v.","a":[],"s":[{"m":"혁신하다","y":[],"e":[["Companies must innovate.","기업은 혁신해야 한다."],["The company innovates faster than its rivals.","그 회사는 경쟁사보다 빠르게 혁신한다."],["They innovate every year.","그들은 해마다 혁신한다."]]}]},{"l":"고2-4","w":"input","p":"n.","a":[],"s":[{"m":"입력, 투입","y":[],"e":[["We need your input.","우리는 당신의 의견이 필요하다."],["The input was wrong.","입력이 잘못되었다."],["Her input improved the plan.","그녀의 의견이 계획을 개선했다."]]}]},{"l":"고2-4","w":"inquire","p":"v.","a":[],"s":[{"m":"묻다, 문의하다","y":["ask"],"e":[["She inquired about the job.","그녀는 그 일자리에 대해 문의했다."],["He inquired after my family.","그는 우리 가족 안부를 물었다."],["Please inquire at the office.","사무실에 문의해 주세요."]]}]},{"l":"고2-4","w":"wear out","p":"phr.","a":[],"s":[{"m":"닳아 해지다; 지치게 하다","y":[],"e":[["His shoes wore out quickly.","그의 신발은 금세 해졌다."],["The long walk wore her out.","긴 산책이 그녀를 지치게 했다."],["These tires will wear out soon.","이 타이어는 곧 닳을 것이다."]]}]},{"l":"고2-4","w":"wipe out","p":"phr.","a":[],"s":[{"m":"완전히 없애다, 전멸시키다","y":[],"e":[["The storm wiped out the village.","폭풍이 그 마을을 쓸어 버렸다."],["Disease wiped out many animals.","질병이 많은 동물을 전멸시켰다."],["One mistake wiped out all his profit.","한 번의 실수가 그의 이익을 다 날렸다."]]}]},{"l":"고2-4","w":"work out","p":"phr.","a":[],"s":[{"m":"운동하다; 잘 풀리다; 계산해 내다","y":[],"e":[["She works out at the gym daily.","그녀는 매일 체육관에서 운동한다."],["Everything worked out in the end.","결국 모든 것이 잘 풀렸다."],["He worked out the answer on paper.","그는 종이에 답을 계산해 냈다."]]}]},{"l":"고3-1","w":"by no means","p":"phr.","a":[],"s":[{"m":"결코 ~이 아니다","y":[],"e":[["It is by no means certain.","그것은 결코 확실하지 않다."],["She is by no means a beginner.","그녀는 결코 초보자가 아니다."],["The task was by no means easy.","그 일은 결코 쉽지 않았다."]]}]},{"l":"고3-1","w":"come to terms with","p":"phr.","a":[],"s":[{"m":"(어려움을) 받아들이다, 감수하다","y":[],"e":[["He came to terms with his loss.","그는 자기 상실을 받아들였다."],["She came to terms wi ","a":[],"s":[{"m":"고개를 끄덕이다","y":[],"e":[["She nodded and smiled.","그녀는 고개를 끄덕이며 웃었다."],["He nods when he agrees.","그는 동의할 때 고개를 끄덕인다."],["The teacher nodded at my answer.","선생님이 내 답에 고개를 끄덕였다."]]}]},{"l":"고3-1","w":"nominate","p":"v.","a":[],"s":[{"m":"후보로 지명하다, 추천하다","y":["propose"],"e":[["They nominated her as leader.","그들은 그녀를 대표로 추천했다."],["The film was nominated for an award.","그 영화는 상 후보에 올랐다."],["We nominate one student each term.","우리는 학기마다 학생 한 명을 추천한다."]]}]},{"l":"고3-1","w":"nonetheless","p":"adv.","a":[],"s":[{"m":"그럼에도 불구하고","y":["even so"],"e":[["The test was hard. Nonetheless, I passed.","시험은 어려웠다. 그래도 나는 통과했다."],["Nonetheless, she kept practicing.","그럼에도 그녀는 계속 연습했다."],["He lost. Nonetheless, he smiled.","그는 졌다. 그래도 그는 웃었다."]]}]},{"l":"고3-1","w":"norm","p":"n.","a":[],"s":[{"m":"규범, 표준","y":["standard","convention"],"e":[["Social norms differ by culture.","사회 규범은 문화마다 다르다."],["Working from home became the norm.","재택근무가 표준이 되었다."],["He broke the norms of his time.","그는 그 시대의 규범을 깼다."]]}]},{"l":"고3-1","w":"notion","p":"n.","a":[],"s":[{"m":"개념, 생각","y":["idea","concept"],"e":[["He rejected the notion entirely.","그는 그 생각을 완전히 거부했다."],["The notion of fairness varies.","공정함의 개념은 저마다 다르다."],["She had no notion of the danger.","그녀는 그 위험을 전혀 몰랐다."]]}]},{"l":"고3-1","w":"novel","p":"n.","a":[],"s":[{"m":"소설","y":["fiction"],"e":[["She wrote her first novel at twenty.","그녀는 스무 살에 첫 소설을 썼다."],["The novel has three hundred pages.","그 소설은 삼백 쪽이다."],["I read a novel on the train.","나는 기차에서 소설을 읽었다."]]}]},{"l":"고3-1","w":"nuclear","p":"adj.","a":[],"s":[{"m":"핵의, 원자력의","y":["atomic"],"e":[["The country closed a nuclear plant.","그 나라는 원자력 발전소 하나를 닫았다."],["Nuclear energy has risks.","원자력 에너지에는 위험이 있다."],["They discussed nuclear safety.","그들은 핵 안전을 논의했다."]]}]},{"l":"고3-1","w":"numerous","p":"adj.","a":["few","few","rare"],"s":[{"m":"많은, 수많은","y":["many"],"e":[["She has numerous friends.","그녀에게는 친구가 아주 많다."],["Numerous birds gathered on the roof.","수많은 새가 지붕에 모였다."],["We tried numerous times.","우리는 수없이 시도했다."]]}]},{"l":"고3-1","w":"nurture","p":"v.","a":[],"s":[{"m":"양육하다, 기르다","y":["raise","foster"],"e":[["Parents nurture their children.","부모는 자녀를 양육한다."],["We should nurture young talent.","우리는 젊은 인재를 길러야 한다."],["She nurtured the idea for years.","그녀는 그 생각을 여러 해 키워 왔다."]]}]},{"l":"고3-1","w":"obey","p":"v.","a":["command","rebel","resist","command"],"s":[{"m":"따르다, 복종하다","y":["follow"],"e":[["Please obey the rules.","규칙을 지켜 주세요."],["The dog obeyed at once.","그 개는 곧바로 말을 들었다."],["Drivers must obey traffic signs.","운전자는 교통 표지를 따라야 한다."]]}]},{"l":"고3-1","w":"oblige","p":"v.","a":[],"s":[{"m":"의무를 지우다, 하게 하다","y":["force"],"e":[["The law obliges us to wear belts.","법은 우리에게 안전벨트를 매도록 한다."],["He felt obliged to help.","그는 도와야 한다고 느꼈다."],["Nothing obliges you to answer.","너는 답할 의무가 없다."]]}]},{"l":"고3-1","w":"obscure","p":"adj., v.","a":[],"s":[{"m":"잘 알려지지 않은, 모호한","y":["unclear","little-known"],"e":[["He quoted an obscure poet.","그는 잘 알려지지 않은 시인을 인용했다."],["The meaning remains obscure.","그 의미는 여전히 모호하다."]]},{"m":"가리다, 흐리게 하다","y":["hide","block"],"e":[["Clouds obscured the moon.","구름이 달을 가렸다."],["Jargon obscures the real message.","전문 용어가 진짜 메시지를 가린다."]]}]},{"l":"고3-2","w":"in need of","p":"phr.","a":[],"s":[{"m":"~을 필요로 하는","y":[],"e":[["The house is in need of repair.","그 집은 수리가 필요하다."],["Many families are in need of help.","많은 가정이 도움을 필요로 한다."],["She was in need of rest.","그녀는 휴식이 필요했다."]]}]},{"l":"고3-2","w":"in other words","p":"phr.","a":[],"s":[{"m":"다시 말해, 즉","y":[],"e":[["In other words, we must start over.","다시 말해, 우리는 처음부터 시작해야 한다."],["He refused; in other words, he said no.","그는 거절했다, 즉 안 된다고 한 것이다."],["In other words, the plan failed.","다시 말해 그 계획은 실패했다."]]}]},{"l":"고3-2","w":"in place of","p":"phr.","a":[],"s":[{"m":"~ 대신에","y":["instead of"],"e":[["Use honey in place of sugar.","설탕 대신 꿀을 쓰세요."],["She spoke in place of the director.","그녀가 원장 대신 발언했다."],["We used cloth in place of paper.","우리는 종이 대신 천을 썼다."]]}]},{"l":"고3-2","w":"in proportion to","p":"phr.","a":[],"s":[{"m":"~에 비례하여","y":[],"e":[["Pay rises in proportion to experience.","급여는 경력에 비례해 오른다."],["The cost grows in proportion to size.","비용은 크기에 비례해 늘어난다."],["Rewards were given in proportion to effort.","보상은 노력에 비례해 주어졌다."]]}]},{"l":"고3-2","w":"in public","p":"phr.","a":[],"s":[{"m":"사람들 앞에서, 공개적으로","y":[],"e":[["She rarely speaks in public.","그녀는 사람들 앞에서 좀처럼 말하지 않는다."],["He apologized in public.","그는 공개적으로 사과했다."],["Do not argue in public.","사람들 앞에서 다투지 마라."]]}]},{"l":"고3-2","w":"in pursuit of","p":"phr.","a":[],"s":[{"m":"~을 좇아, 추구하여","y":[],"e":[["He left home in pursuit of a dream.","그는 꿈을 좇아 집을 떠났다."],["They traveled in pursuit of knowledge.","그들은 지식을 찾아 여행했다."],["She works hard in pursuit of her goal.","그녀는 목표를 좇아 열심히 일한다."]]}]},{"l":"고3-2","w":"in response to","p":"phr.","a":[],"s":[{"m":"~에 대응하여, 답하여","y":[],"e":[["In response to the letter, she called.","그 편지에 답하여 그녀는 전화했다."],["Prices fell in response to demand.","수요에 대응해 가격이 떨어졌다."],["The city acted in response to the flood.","그 도시는 홍수에 대응해 조치를 취했다."]]}]},{"l":"고3-2","w":"in return for","p":"phr.","a":[],"s":[{"m":"~에 대한 보답으로","y":[],"e":[["He gave her flowers in return for her help.","그는 도움에 대한 보답으로 그녀에게 꽃을 주었다."],["She asked nothing in return for her kindness.","그녀는 친절의 대가로 아무것도 바라지 않았다."],["They offered land in return for peace.","그들은 평화의 대가로 땅을 내주었다."]]}]},{"l":"고3-2","w":"in short","p":"phr.","a":[],"s":[{"m":"요컨대, 간단히 말해","y":[],"e":[["In short, the plan will not work.","요컨대 그 계획은 통하지 않을 것이다."],["In short, we need more time.","간단히 말해 우리는 시간이 더 필요하다."],["In short, she was right all along.","요컨대 그녀가 처음부터 옳았다."]]}]},{"l":"고3-2","w":"in the course of","p":"phr.","a":[],"s":[{"m":"~하는 동안에","y":[],"e":[["In the course of the year, much changed.","그해 동안 많은 것이 바뀌었다."],["In the course of the talk, he mentioned it.","이야기하는 동안 그는 그것을 언급했다."],["Many trees fell in the course of the storm.","폭풍이 부는 동안 많은 나무가 쓰러졌다."]]}]},{"l":"고3-2","w":"in the face of","p":"phr.","a":[],"s":[{"m":"~에 직면하여, ~에도 불구하고","y":[],"e":[["She stayed calm in the face of danger.","그녀는 위험에 직면해서도 침착했다."],["They kept working in the face of criticism.","그들은 비판에도 불구하고 계속 일했다."],["He showed courage in the face of loss.","그는 상실 앞에서 용기를 보였다."]]}]},{"l":"고3-2","w":"in the wake of","p":"phr.","a":[],"s":[{"m":"~의 여파로, ~에 뒤이어","y":[],"e":[["The city rebuilt in the wake of the fire.","그 도시는 화재의 여파로 다시 지어졌다."],["Prices rose in the wake of the storm.","폭풍의 여파로 물가가 올랐다."],["New rules came in the wake of the accident.","그 사고에 뒤이어 새 규칙이 생겼다."]]}]},{"l":"고3-2","w":"in view of","p":"phr.","a":[],"s":[{"m":"~을 고려하여","y":[],"e":[["In view of the weather, we stayed home.","날씨를 고려해 우리는 집에 있었다."],["In view of his age, that is remarkable.","그의 나이를 고려하면 그것은 놀랍다."],["In view of the cost, we chose another way.","비용을 고려해 우리는 다른 길을 택했다."]]}]},{"l":"고3-2","w":"keep abreast of","p":"phr.","a":[],"s":[{"m":"~에 뒤지지 않고 알고 있다","y":[],"e":[["She keeps abreast of the news.","그녀는 소식에 뒤지지 않고 있다."],["Doctors must keep abreast of research.","의사는 연구를 계속 따라가야 한다."],["He keeps abreast of the latest trends.","그는 최신 흐름을 계속 파악한다."]]}]},{"l":"고3-2","w":"lay off","p":"phr.","a":[],"s":[{"m":"(직원을) 해고하다","y":[],"e":[["The factory laid off fifty workers.","그 공장은 노동자 쉰 명을 해고했다."],["He was laid off last winter.","그는 지난겨울에 해고되었다."],["They laid off staff to cut costs.","그들은 비용을 줄이려 직원을 해고했다."]]}]},{"l":"고3-2","w":"live up to","p":"phr.","a":[],"s":[{"m":"(기대에) 부응하다","y":[],"e":[["The film lived up to its reputation.","그 영화는 명성에 부응했다."],["She lived up to her promise.","그녀는 약속을 지켰다."],["He tried to live up to their hopes.","그는 그들의 기대에 부응하려 애썼다."]]}]},{"l":"고3-2","w":"obsess","p":"v.","a":[],"s":[{"m":"사로잡다, 집착하게 하다","y":["preoccupy"],"e":[["He is obsessed with soccer.","그는 축구에 푹 빠져 있다."],["The idea obsessed her for years.","그 생각이 여러 해 동안 그녀를 사로잡았다."],["Do not obsess over small mistakes.","작은 실수에 집착하지 마라."]]}]},{"l":"고3-2","w":"obstacle","p":"n.","a":[],"s":[{"m":"장애물, 방해물","y":["barrier","hurdle"],"e":[["Fear is the biggest obstacle.","두려움이 가장 큰 장애물이다."],["They overcame many obstacles.","그들은 많은 장애물을 극복했다."],["An obstacle blocked the road.","장애물이 도로를 막았다."]]}]},{"l":"고3-2","w":"obtain","p":"v.","a":[],"s":[{"m":"얻다, 획득하다","y":["get","acquire"],"e":[["She obtained a scholarship.","그녀는 장학금을 받았다."],["You must obtain permission first.","먼저 허가를 받아야 한다."],["The data were obtained from a survey.","그 자료는 설문 조사에서 얻었다."]]}]},{"l":"고3-2","w":"occupy","p":"v.","a":[],"s":[{"m":"차지하다, 사용하다","y":["take up"],"e":[["The sofa occupies half the room.","소파가 방의 절반을 차지한다."],["All the seats were occupied.","모든 좌석이 차 있었다."],["Homework occupied my whole evening.","숙제가 내 저녁 시간을 다 차지했다."]]}]},{"l":"고3-2","w":"offend","p":"v.","a":[],"s":[{"m":"기분을 상하게 하다","y":["upset"],"e":[["I did not mean to offend you.","너의 기분을 상하게 할 생각은 아니었다."],["His joke offended some students.","그의 농담은 몇몇 학생의 기분을 상하게 했다."],["She was offended by the remark.","그녀는 그 말에 기분이 상했다."]]}]},{"l":"고3-2","w":"on the contrary","p":"phr.","a":[],"s":[{"m":"그와는 반대로","y":[],"e":[["He is not lazy; on the contrary, he works hard.","그는 게으르지 않다. 오히려 열심히 일한다."],["On the contrary, sales went up.","그와는 반대로 매출이 올랐다."],["I did not dislike it; on the contrary, I loved it.","나는 그것을 싫어하지 않았다. 오히려 아주 좋아했다."]]}]},{"l":"고3-2","w":"opportune","p":"adj.","a":[],"s":[{"m":"시의적절한, 알맞은","y":["timely"],"e":[["He arrived at an opportune moment.","그는 알맞은 순간에 도착했다."],["This is an opportune time to ask.","지금이 물어보기 좋은 때다."],["The letter came at an opportune time.","그 편지는 시의적절하게 도착했다."]]}]},{"l":"고3-2","w":"opt","p":"v.","a":[],"s":[{"m":"선택하다","y":["choose"],"e":[["She opted for the shorter course.","그녀는 더 짧은 과정을 선택했다."],["Many students opt to study abroad.","많은 학생이 유학을 택한다."],["We opted out of the trip.","우리는 그 여행에 참여하지 않기로 했다."]]}]},{"l":"고3-2","w":"optimist","p":"n.","a":[],"s":[{"m":"낙관주의자","y":[],"e":[["My father is a true optimist.","우리 아버지는 진정한 낙관주의자다."],["An optimist sees the bright side.","낙관주의자는 밝은 면을 본다."],["Optimists recover from failure faster.","낙관하는 사람은 실패에서 더 빨리 회복한다."]]}]},{"l":"고3-2","w":"optimistic","p":"adj.","a":[],"s":[{"m":"낙관적인","y":["hopeful","positive"],"e":[["She is optimistic about the future.","그녀는 미래에 대해 낙관적이다."],["We remain optimistic despite the loss.","패배에도 우리는 낙관적이다."],["His optimistic view encouraged us.","그의 낙관적인 시각이 우리를 북돋았다."]]}]},{"l":"고3-2","w":"oral","p":"adj.","a":[],"s":[{"m":"구두의, 입의","y":["spoken"],"e":[["We had an oral test today.","우리는 오늘 구술 시험을 봤다."],["Oral health matters a lot.","구강 건강은 아주 중요하다."],["She gave an oral report to the class.","그녀는 반 앞에서 구두로 발표했다."]]}]},{"l":"고3-2","w":"orbit","p":"n.","a":[],"s":[{"m":"궤도","y":[],"e":[["The moon moves in orbit around the earth.","달은 지구 둘레의 궤도를 돈다."],["The satellite reached orbit safely.","그 위성은 무사히 궤도에 올랐다."],["Its orbit takes one year.","그 궤도를 도는 데 일 년이 걸린다."]]}]},{"l":"고3-2","w":"orchestra","p":"n.","a":[],"s":[{"m":"관현악단, 오케스트라","y":[],"e":[["The orchestra played a waltz.","관현악단이 왈츠를 연주했다."],["She joined the school orchestra.","그녀는 학교 오케스트라에 들어갔다."],["A large orchestra filled the stage.","큰 관현악단이 무대를 채웠다."]]}]},{"l":"고3-2","w":"organ","p":"n.","a":[],"s":[{"m":"장기, 기관","y":[],"e":[["The heart is a vital organ.","심장은 중요한 장기다."],["Each organ has its own job.","각 기관은 저마다 역할이 있다."],["Smoking damages several organs.","흡연은 여러 장기를 해친다."]]},{"m":"오르간","y":[],"e":[["The church has an old organ.","그 교회에는 오래된 오르간이 있다."],["He played the organ at the wedding.","그는 결혼식에서 오르간을 연주했다."]]}]},{"l":"고3-2","w":"organize","p":"v.","a":["mess","mess"],"s":[{"m":"조직하다, 정리하다","y":["arrange"],"e":[["We organized a book fair.","우리는 도서 축제를 열었다."],["She organized her desk neatly.","그녀는 책상을 깔끔하게 정리했다."],["Students organized a school festival.","학생들이 학교 축제를 준비했다."]]}]},{"l":"고3-2","w":"orient","p":"v.","a":[],"s":[{"m":"맞추다, 방향을 잡다","y":[],"e":[["The course is oriented toward beginners.","그 강좌는 초보자에게 맞춰져 있다."],["He oriented the map to the north.","그는 지도를 북쪽으로 맞췄다."],["New workers orient themselves in a week.","새 직원들은 일주일이면 적응한다."]]}]},{"l":"고3-2","w":"origin","p":"n.","a r.","a":[],"s":[{"m":"배제하다, 제외하다","y":["exclude"],"e":[["Police ruled out an accident.","경찰은 사고 가능성을 배제했다."],["We cannot rule out that option.","우리는 그 선택지를 배제할 수 없다."],["The doctor ruled out infection.","의사는 감염을 배제했다."]]}]},{"l":"고3-4","w":"run counter to","p":"phr.","a":[],"s":[{"m":"~에 어긋나다, 배치되다","y":[],"e":[["The result runs counter to our theory.","그 결과는 우리 이론에 어긋난다."],["His action ran counter to the rules.","그의 행동은 규칙에 어긋났다."],["That runs counter to what she said.","그것은 그녀가 한 말과 어긋난다."]]}]},{"l":"고3-4","w":"see to","p":"phr.","a":[],"s":[{"m":"~을 처리하다, 돌보다","y":[],"e":[["I will see to the arrangements.","내가 준비를 처리하겠다."],["Please see to it that the door is locked.","문이 잠기도록 챙겨 주세요."],["She saw to the guests herself.","그녀가 직접 손님들을 챙겼다."]]}]},{"l":"고3-4","w":"set forth","p":"phr.","a":[],"s":[{"m":"(생각을) 제시하다; 출발하다","y":[],"e":[["He set forth his argument clearly.","그는 자기 주장을 분명히 제시했다."],["The report sets forth three options.","그 보고서는 세 가지 선택지를 제시한다."],["They set forth at dawn.","그들은 새벽에 출발했다."]]}]},{"l":"고3-4","w":"shed light on","p":"phr.","a":[],"s":[{"m":"~을 밝히다, 이해를 돕다","y":[],"e":[["The study sheds light on the cause.","그 연구는 원인을 밝혀 준다."],["Her letter shed light on the mystery.","그녀의 편지가 그 수수께끼를 밝혀 주었다."],["New data shed light on the problem.","새 자료가 그 문제를 이해하게 해 준다."]]}]},{"l":"고3-4","w":"stand to reason","p":"phr.","a":[],"s":[{"m":"이치에 맞다, 당연하다","y":[],"e":[["It stands to reason that he was tired.","그가 피곤했던 것은 당연하다."],["It stands to reason they would refuse.","그들이 거절하리라는 것은 당연하다."],["That does not stand to reason.","그것은 이치에 맞지 않는다."]]}]},{"l":"고3-4","w":"subscribe to","p":"phr.","a":[],"s":[{"m":"구독하다; (의견에) 동의하다","y":[],"e":[["We subscribe to two newspapers.","우리는 신문 두 종을 구독한다."],["She does not subscribe to that view.","그녀는 그 견해에 동의하지 않는다."],["He subscribed to the magazine for years.","그는 여러 해 그 잡지를 구독했다."]]}]},{"l":"고3-4","w":"substitute for","p":"phr.","a":[],"s":[{"m":"~을 대신하다, 대체하다","y":[],"e":[["Nothing can substitute for practice.","무엇도 연습을 대신할 수 ch of his wealth away.","그는 재산의 많은 부분을 나눠 주었다."],["Wealth does not buy happiness.","부가 행복을 사 주지는 않는다."],["The country has great natural wealth.","그 나라는 천연자원이 풍부하다."]]}]},{"l":"고3-4","w":"weave","p":"v.","a":[],"s":[{"m":"짜다, 엮다","y":[],"e":[["They weave cloth by hand.","그들은 손으로 천을 짠다."],["She weaves baskets from grass.","그녀는 풀로 바구니를 엮는다."],["The writer weaves two stories together.","그 작가는 두 이야기를 엮는다."]]}]},{"l":"고3-4","w":"weed","p":"n.","a":[],"s":[{"m":"잡초","y":[],"e":[["Pull the weeds from the garden.","정원에서 잡초를 뽑아라."],["Weeds grow fast after rain.","비가 오면 잡초가 빨리 자란다."],["One weed hid among the flowers.","잡초 하나가 꽃 사이에 숨어 있었다."]]}]},{"l":"고3-4","w":"weird","p":"adj.","a":[],"s":[{"m":"기이한, 이상한","y":["strange"],"e":[["That was a weird dream.","그것은 기이한 꿈이었다."],["The machine makes a weird sound.","그 기계는 이상한 소리를 낸다."],["It feels weird to be back.","돌아오니 기분이 묘하다."]]}]},{"l":"고3-4","w":"welfare","p":"n.","a":[],"s":[{"m":"복지, 안녕","y":["well-being"],"e":[["The school cares about student welfare.","그 학교는 학생 복지를 신경 쓴다."],["Animal welfare matters to her.","동물 복지는 그녀에게 중요하다."],["Welfare programs help poor families.","복지 제도는 가난한 가정을 돕는다."]]}]},{"l":"고3-4","w":"wheat","p":"n.","a":[],"s":[{"m":"밀","y":[],"e":[["Bread is made from wheat.","빵은 밀로 만든다."],["Wheat fields turned golden.","밀밭이 황금빛으로 변했다."],["They harvest wheat in July.","그들은 칠월에 밀을 수확한다."]]}]},{"l":"고3-4","w":"whereas","p":"conj.","a":[],"s":[{"m":"~인 반면에","y":["while"],"e":[["He likes tea, whereas I prefer coffee.","그는 차를 좋아하는 반면 나는 커피를 더 좋아한다."],["Whereas summer is hot, winter is dry.","여름은 더운 반면 겨울은 건조하다."],["She reads slowly, whereas her brother reads fast.","그녀는 천천히 읽는 반면 남동생은 빨리 읽는다."]]}]},{"l":"고3-4","w":"whip","p":"n.","a":[],"s":[{"m":"채찍","y":[],"e":[["The rider carried a whip.","그 기수는 채찍을 들고 있었다."],["A whip cracked in the air.","채찍이 공중에서 소리를 냈다."],["The old whip hangs on the wall.","낡은 채찍이 벽에 걸려 있다."]]}]},{"l":"고3-4","w":"wicked","p":"adj.","a":[],"s":[{"m":"사악한, 짓궂은","y":["evil"],"e":[["The wicked king lost his throne.","그 사악한 왕은 왕좌를 잃었다."],["She gave a wicked grin.","그녀는 짓궂은 미소를 지었다."],["Wicked deeds never stay hidden.","악행은 결코 숨겨지지 않는다."]]}]},{"l":"고3-4","w":"widespread","p":"adj.","a":[],"s":[{"m":"널리 퍼진, 광범위한","y":["common","extensive"],"e":[["The belief is widespread.","그 믿음은 널리 퍼져 있다."],["There was widespread damage after the storm.","폭풍 후 광범위한 피해가 있었다."],["Smartphone use is widespread among teens.","스마트폰 사용은 십 대 사이에 널리 퍼져 있다."]]}]},{"l":"고3-4","w":"wit","p":"n.","a":[],"s":[{"m":"재치, 기지","y":[],"e":[["Her wit made us laugh.","그녀의 재치가 우리를 웃게 했다."],["He answered with quick wit.","그는 재빠른 기지로 답했다."],["Wit helps in hard moments.","재치는 힘든 순간에 도움이 된다."]]}]},{"l":"고3-4","w":"with regard to","p":"phr.","a":[],"s":[{"m":"~에 관하여","y":["concerning","about"],"e":[["With regard to your question, I agree.","당신 질문에 관해서는 동의합니다."],["Nothing changed with regard to the rules.","규칙에 관해서는 아무것도 바뀌지 않았다."],["He wrote with regard to the new policy.","그는 새 정책에 관해 편지를 썼다."]]}]},{"l":"고3-4","w":"with respect to","p":"phr.","a":[],"s":[{"m":"~에 관하여","y":["regarding","concerning"],"e":[["With respect to cost, we have concerns.","비용에 관하여 우리는 우려가 있다."],["He said nothing with respect to the delay.","그는 지연에 관해 아무 말도 하지 않았다."],["With respect to safety, the rules are strict.","안전에 관해서는 규칙이 엄격하다."]]}]},{"l":"고3-4","w":"withdraw","p":"v.","a":[],"s":[{"m":"철회하다, 인출하다","y":[],"e":[["I withdraw my question.","나는 내 질문을 철회한다."],["She withdraws money every Friday.","그녀는 금요일마다 돈을 찾는다."],["They withdraw support if rules break.","규칙이 깨지면 그들은 지원을 거둔다."]]}]},{"l":"고3-4","w":"witness","p":"n.","a":[],"s":[{"m":"목격자, 증인","y":["observer"],"e":[["The witness told the truth.","그 목격자는 사실대로 말했다."],["Two witnesses saw the accident.","목격자 두 명이 그 사고를 보았다."],["She was a witness at the wedding.","그녀는 결혼식의 증인이었다."]]}]},{"l":"고3-4","w":"worship","p":"v.","a":[],"s":[{"m":"숭배하다, 예배하다","y":[],"e":[["They worship at the temple.","그들은 그 절에서 예배한다."],["Fans worship the singer like a hero.","팬들은 그 가수를 영웅처럼 떠받든다."],["People worshipped the sun long ago.","옛날 사람들은 해를 숭배했다."]]}]},{"l":"고3-4","w":"wreck","p":"n.","a":[],"s":[{"m":"난파선, 잔해","y":["ruin"],"e":[["Divers found an old wreck.","잠수부들이 오래된 난파선을 찾았다."],["The wreck of the car was towed away.","그 차의 잔해가 견인되었다."],["Storms leave wrecks on the shore.","폭풍은 해안에 잔해를 남긴다."]]}]},{"l":"고3-4","w":"yield","p":"v.","a":[],"s":[{"m":"양보하다, 굴복하다","y":["give way"],"e":[["Yield to cars on the main road.","큰길의 차에 양보해라."],["He never yields to pressure.","그는 결코 압박에 굴하지 않는다."],["The old door yielded to a push.","낡은 문이 밀자 열렸다."]]},{"m":"생산하다, 내다","y":["produce"],"e":[["The field yields good rice.","그 밭은 좋은 쌀을 낸다."],["The study yielded clear results.","그 연구는 분명한 결과를 냈다."]]}]},{"l":"고3-4","w":"zone","p":"n.","a":[],"s":[{"m":"구역, 지대","y":["area"],"e":[["This is a quiet zone.","여기는 조용한 구역이다."],["Drivers must slow down in the school zone.","운전자는 학교 구역에서 속도를 줄여야 한다."],["The city set up green zones.","그 도시는 녹지 구역을 만들었다."]]}]}];
const LEVELS = [...new Set(DATA.map(d => d.l))];
const PAGE = 60;

let level = '전체';
let query = '';
let shown = PAGE;

const $q = document.getElementById('q');
const $list = document.getElementById('list');
const $levels = document.getElementById('levels');

for (const l of ['전체', ...LEVELS]) {
  const b = document.createElement('button');
  b.textContent = l;
  b.setAttribute('aria-pressed', String(l === level));
  b.onclick = () => {
    level = l; shown = PAGE;
    [...$levels.children].forEach(c => c.setAttribute('aria-pressed', String(c.textContent === l)));
    render();
  };
  $levels.appendChild(b);
}

$q.addEventListener('input', () => { query = $q.value.trim().toLowerCase(); shown = PAGE; render(); });

function matches(d) {
  if (level !== '전체' && d.l !== level) return false;
  if (!query) return true;
  if (d.w.toLowerCase().includes(query)) return true;
  for (const s of d.s) {
    if (s.m.toLowerCase().includes(query)) return true;
    if (s.y.some(y => y.toLowerCase().includes(query))) return true;
    for (const [en, ko] of s.e) {
      if (en.toLowerCase().includes(query) || ko.includes(query)) return true;
    }
  }
  return d.a.some(a => a.toLowerCase().includes(query));
}

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function hi(s) {
  const t = esc(s);
  if (!query) return t;
  const i = t.toLowerCase().indexOf(query);
  if (i < 0) return t;
  return t.slice(0, i) + '<mark>' + t.slice(i, i + query.length) + '</mark>' + t.slice(i + query.length);
}

function card(d) {
  let h = '<div class="word"><div class="head">';
  h += '<span class="w">' + hi(d.w) + '</span><span class="pos">' + esc(d.p) + '</span>';
  h += '<span class="lv">' + d.l + '</span></div>';
  for (const s of d.s) {
    h += '<div class="sense"><div class="m">' + hi(s.m) + '</div>';
    const bits = [];
    if (s.y.length) bits.push('바꿔 쓰기 <span class="tag">' + s.y.map(hi).join(', ') + '</span>');
    if (d.a.length) bits.push('반대말 <span class="tag">' + d.a.map(hi).join(', ') + '</span>');
    if (bits.length) h += '<div class="tags">' + bits.join(' · ') + '</div>';
    h += '<ol>';
    for (const [en, ko] of s.e) {
      h += '<li><div class="en">' + hi(en) + '</div><div class="ko">' + hi(ko) + '</div></li>';
    }
    h += '</ol></div>';
  }
  return h + '</div>';
}

function render() {
  const hits = DATA.filter(matches);
  if (hits.length === 0) {
    $list.innerHTML = '<p class="empty">찾는 단어가 없어요.</p>';
    return;
  }
  let h = hits.slice(0, shown).map(card).join('');
  if (hits.length > shown) {
    h += '<button class="more" id="more">더 보기 (' + (hits.length - shown) + '개 남음)</button>';
  }
  $list.innerHTML = h;
  const $more = document.getElementById('more');
  if ($more) $more.onclick = () => { shown += PAGE; render(); };
}

render();
</script>
